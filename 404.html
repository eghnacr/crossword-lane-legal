/* Layout: the home page's field with one blank tile on it: the page you wanted is an empty square. */
:root {
  --indigo-hi: #6685E8;
  --indigo: #3B5BDB;
  --indigo-lo: #2F4AC0;
  --amber: #FFCA28;
  --amber-lip: #C98A00;
  --face-top: #FFF8E1;
  --face-bottom: #FFE082;
  --tile-ink: #5D4037;
  --font: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --u: max(0.8px, min(calc(100vw / 390), calc(100vh / 680), 1.6px));
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--indigo-lo); color: #fff; font-family: var(--font); -webkit-font-smoothing: antialiased; }
main {
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: calc(14 * var(--u));
  text-align: center;
  padding-block: 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background:
    radial-gradient(circle calc(0.98 * min(100vw, 100vh)) at 50% -6%, rgba(255, 255, 255, 0.26), rgba(255, 255, 255, 0) 64%),
    linear-gradient(165deg, var(--indigo-hi) 0%, var(--indigo) 46%, var(--indigo-lo) 100%);
}
.slot {
  width: calc(96 * var(--u));
  height: calc(96 * var(--u));
  margin-bottom: calc(18 * var(--u));
  border-radius: calc(19 * var(--u));
  border: calc(2.5 * var(--u)) dashed rgba(255, 255, 255, 0.55);
  background: rgba(255, 255, 255, 0.085);
  display: grid;
  place-items: center;
  transform: rotate(-6deg);
  font-weight: 900;
  font-size: calc(54 * var(--u));
  line-height: 1;
  color: rgba(255, 255, 255, 0.6);
}
h1 { margin: 0; font-weight: 900; font-size: calc(30 * var(--u)); line-height: 1.1; letter-spacing: calc(-0.4 * var(--u)); text-wrap: balance; }
p { margin: 0; font-weight: 700; font-size: max(14px, calc(14 * var(--u))); line-height: 1.4; color: rgba(255, 255, 255, 0.7); }
a {
  margin-top: calc(14 * var(--u));
  display: inline-block;
  padding: 12px 22px;
  border-radius: 999px;
  background: #fff;
  color: var(--indigo-lo);
  font-weight: 700;
  font-size: 15px;
  text-decoration: none;
  box-shadow: 0 4px 0 rgba(8, 14, 45, 0.25);
}
a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
</style>
